# Pinned run configuration. Mirrors src/config.py defaults; override via
# env vars (.env) for a specific experiment run rather than editing this
# file per-run, so configs stay reproducible/diffable.

dataset: nfcorpus

retrieval:
  bm25_db_path: data/bm25_index.sqlite3
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
  reranker_top_k: 50
  reranker_max_candidates: 100

generation:
  provider: ollama
  # Brief recommends Qwen3.5-2B; not pulled locally yet, using the closest
  # available Ollama model instead (see src/config.py).
  model: qwen2.5:3b
  context_tokens: 4096
  output_tokens: 64
  max_calls_per_query: 2

agent:
  action_budget: 3

# Frozen per docs/milestones.md's go/no-go calibration step, from two
# NFCorpus dev runs (scripts/06_agent_vs_static.py --freeze-slo, n=100,
# for harm_rate/llm_calls; scripts/07_latency_benchmark.py, n=50 paired
# samples per pipeline, for p95_latency after an isolated,
# order-alternated benchmark -- the naive wall-clock comparison in an
# early scripts/06 run was confounded by KV-cache reuse and long-run
# drift, see git history on this file and on scripts/07).
slo:
  max_harm_rate: 0.1072
  max_expected_llm_calls: 1.1549
  max_p95_latency_ms: 22963.8

k_values: [10, 100]
seed: 42
