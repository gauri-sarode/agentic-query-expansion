# Pinned run configuration. Mirrors src/config.py defaults; override via
# env vars (.env) for a specific experiment run rather than editing this
# file per-run, so configs stay reproducible/diffable.

dataset: nfcorpus

retrieval:
  bm25_db_path: data/bm25_index.sqlite3
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
  reranker_top_k: 50
  reranker_max_candidates: 100

generation:
  provider: ollama
  # Brief recommends Qwen3.5-2B; not pulled locally yet, using the closest
  # available Ollama model instead (see src/config.py).
  model: qwen2.5:3b
  context_tokens: 4096
  output_tokens: 64
  max_calls_per_query: 2

agent:
  action_budget: 3

# Frozen from the full n=1175 TAIL-test RQ2 run (2026-09-02,
# scripts/06_agent_vs_static.py --freeze-slo, frozen retrieval config +
# verifier per configs/experimental_protocol.yaml). harm_rate and
# llm_calls come directly from that run's --freeze-slo output.
# max_p95_latency_ms does NOT: that run spanned multiple real-world
# machine-sleep gaps (this was a long-running background job monitored
# across several sessions), and 78/1175 episode_latency_ms values were
# inflated to minutes (max ~17min) by wall-clock time elapsing while the
# process was suspended, not real per-episode compute time. Rather than
# freeze a contaminated p95, this value is the p95 of the remaining
# 1097 episodes with a plausible single-episode latency (<60s, generous
# given up to 2 LLM calls plus reranking) -- clean p50=13.5s,
# p95=30.8s, max=55.2s, consistent with the same run's static-pass mean
# (~19s/query) and this project's earlier latency-benchmark numbers.
slo:
  max_harm_rate: 0.1234
  max_expected_llm_calls: 1.2153
  max_p95_latency_ms: 30780.4

k_values: [10, 100]
seed: 42
